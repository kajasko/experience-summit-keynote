<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Motion katalog — všechno, co umím</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #e0e7e8;
      --teal: #005860;
      --teal-deep: #03383d;
      --lime: #c3d552;
      --muted: #627779;
      --line: #c5d0d2;
      --white: #f7f9f8;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --move: cubic-bezier(0.16, 1, 0.3, 1);
      --grad: linear-gradient(90deg, #012226 0%, #005860 34%, #178f97 68%, #2eb4bc 100%);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #c5d0d2; color: var(--teal); font-family: Montserrat, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    .bar {
      position: sticky; top: 0; z-index: 30;
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
      padding: 14px 24px;
      background: color-mix(in srgb, var(--bg) 92%, white);
      border-bottom: 1px solid var(--line);
    }
    .bar h1 { font-size: 14px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    .bar .sub { font-size: 12px; color: var(--muted); font-weight: 600; }
    .grow { flex: 1; min-width: 12px; }
    .count { font-size: 12px; font-weight: 800; padding: 7px 12px; border-radius: 999px; background: var(--teal-deep); color: #d7e6e7; }
    button.primary, button.ghost, .filters button {
      font: inherit; font-size: 12px; font-weight: 700; border: 0; border-radius: 999px; padding: 7px 14px; cursor: pointer;
    }
    button.primary { background: var(--lime); color: var(--teal-deep); }
    button.ghost { background: transparent; color: var(--teal); border: 1px solid var(--line); }
    .filters { display: flex; gap: 6px; flex-wrap: wrap; padding: 12px 24px 0; }
    .filters button { background: var(--white); color: var(--muted); border: 1px solid var(--line); }
    .filters button.on { background: var(--teal-deep); color: #d7e6e7; border-color: var(--teal-deep); }
    nav.toc { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 24px 0; }
    nav.toc a { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); text-decoration: none; padding: 5px 9px; }
    nav.toc a:hover { color: var(--teal); }
    main { padding: 6px 24px 80px; max-width: 1560px; margin: 0 auto; }
    .intro { max-width: 72ch; margin: 18px 0 6px; font-size: 17px; font-weight: 600; line-height: 1.4; color: var(--teal-deep); }
    .intro small { display: block; margin-top: 8px; font-size: 13px; font-weight: 500; color: var(--muted); }
    h2 { margin: 32px 0 12px; font-size: 12px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; display: flex; align-items: center; gap: 12px; }
    h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
    .card { background: var(--white); border-radius: 14px; overflow: hidden; border: 2px solid transparent; box-shadow: 0 8px 24px rgba(0,88,96,.08); }
    .card.is-picked { border-color: var(--lime); }
    .card.is-no { opacity: .7; }
    .card.hide { display: none; }
    .stage { position: relative; height: 158px; background: var(--bg); overflow: hidden; cursor: pointer; perspective: 900px; }
    .stage.ink { background: #012a2e; }
    .card:hover { border-color: var(--teal); }
    .hint {
      position: absolute; inset: 0; display: grid; place-items: center;
      font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase;
      color: var(--muted); pointer-events: none;
    }
    .merge {
      position: absolute; inset: 0; display: grid; place-items: center;
      font-size: 28px; font-weight: 800; letter-spacing: -.04em; color: var(--teal-deep);
    }
    .merge b { display: inline-block; }
    .meta { padding: 12px 14px 14px; }
    .meta h3 { font-size: 15px; font-weight: 800; letter-spacing: -.03em; color: var(--teal-deep); }
    .tag { display: inline-block; margin: 5px 0 7px; font-size: 9px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--teal); background: #dce7e8; padding: 2px 7px; border-radius: 999px; }
    .tag.add { background: #f3f7dc; }
    .tag.warn { background: #ffefcf; color: #7a5a00; }
    .tag.no { background: #eed6d9; color: #aa3240; }
    .meta p { font-size: 12px; font-weight: 500; line-height: 1.35; color: var(--muted); min-height: 2.6em; }
    .row { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
    .row label { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 700; cursor: pointer; flex: 1; }
    .row input { accent-color: var(--teal); width: 15px; height: 15px; }
    .replay { font: inherit; font-size: 11px; font-weight: 800; border: 0; background: var(--bg); color: var(--teal); padding: 5px 10px; border-radius: 999px; cursor: pointer; }
    .year { position: absolute; left: 22px; top: 42px; font-size: 56px; font-weight: 800; letter-spacing: -.06em; line-height: .9; background-image: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .line { position: absolute; left: 22px; right: 22px; top: 54px; font-size: 24px; font-weight: 800; letter-spacing: -.04em; color: var(--teal-deep); }
    .sub { position: absolute; left: 22px; top: 98px; font-size: 13px; font-weight: 600; color: var(--muted); }
    .photo { position: absolute; right: 16px; top: 20px; width: 108px; height: 118px; border-radius: 12px; background: linear-gradient(160deg, #2eb4bc, #005860); }
    .photo.obj { width: 140px; height: 90px; top: 34px; border-radius: 8px; background: #c9b8a4; }
    .photo.soft { background: #9bb3b6; }
    .lime { position: absolute; left: 22px; top: 122px; width: 72px; height: 3px; background: var(--lime); transform-origin: left center; }
    .caret { display: inline-block; width: 2px; height: .9em; background: var(--teal-deep); margin-left: 4px; vertical-align: -2px; }
    .rail { position: absolute; left: 22px; top: 114px; width: 170px; height: 3px; background: var(--line); border-radius: 99px; }
    .rail-fill { display: block; height: 100%; background: var(--lime); transform: scaleX(0); transform-origin: left; border-radius: 99px; }
    .rail-head { position: absolute; top: -4px; left: 0; width: 11px; height: 11px; border-radius: 50%; background: var(--lime); }
    .stack { position: absolute; left: 22px; top: 32px; display: grid; gap: 7px; }
    .stack span { font-size: 16px; font-weight: 800; letter-spacing: -.03em; color: var(--teal-deep); }
    .stack span.dim { color: rgba(3,56,61,.28); }
    .chars { position: absolute; left: 22px; top: 58px; font-size: 28px; font-weight: 800; letter-spacing: -.04em; color: var(--teal-deep); }
    .chars i { display: inline-block; font-style: normal; }
    .scene-a, .scene-b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 26px; font-weight: 800; letter-spacing: -.04em; }
    .scene-a { background: var(--bg); color: var(--teal-deep); }
    .scene-b { background: #012a2e; color: #d7e6e7; }
    .path { position: absolute; left: 18px; top: 36px; width: 240px; height: 86px; }
    .cardlet { position: absolute; width: 72px; height: 88px; border-radius: 10px; background: #fff; box-shadow: 0 6px 16px rgba(3,56,61,.12); }
    .barfill { position: absolute; left: 22px; bottom: 28px; height: 10px; width: 180px; background: #d5dfe0; border-radius: 99px; overflow: hidden; }
    .barfill > i { display: block; height: 100%; width: 0; background: var(--teal); }
    .picked-box { margin-top: 36px; padding: 20px 22px; border-radius: 14px; background: var(--white); }
    .picked-box h3 { font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 8px; }
    .picked-box pre { white-space: pre-wrap; font: 600 12px/1.45 ui-monospace, Menlo, monospace; color: var(--teal-deep); }
    .mini-chrome {
      position: absolute; left: 12px; top: 10px; z-index: 4;
      font-size: 9px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--lime);
    }
    .half, .door {
      position: absolute; top: 0; bottom: 0; width: 50%; overflow: hidden;
      display: grid; place-items: center;
      font-size: 26px; font-weight: 800; letter-spacing: -.04em; color: var(--teal-deep);
      background: var(--bg);
    }
    .half.l, .door.l { left: 0; }
    .half.r, .door.r { left: 50%; }
    .half span, .door span {
      position: absolute; top: 0; bottom: 0; width: 200%; display: grid; place-items: center;
    }
    .half.l span, .door.l span { left: 0; }
    .half.r span, .door.r span { right: 0; }
    .door.l { transform-origin: left center; backface-visibility: hidden; }
    .door.r { transform-origin: right center; backface-visibility: hidden; }
    .tiles { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 1fr); }
    .tiles i { background: #012a2e; }
  </style>
</head>
<body>
  <div class="bar">
    <div>
      <h1>Motion katalog</h1>
      <div class="sub">Zastavený náhled. Najedď = spustí se. Zaškrtni, co chceš.</div>
    </div>
    <div class="grow"></div>
    <div class="count" id="count">Vybráno 0</div>
    <button class="ghost" type="button" id="clear">Vymazat</button>
    <button class="primary" type="button" id="copy">Zkopírovat výběr</button>
  </div>
  <div class="filters" id="filters"></div>
  <nav class="toc" id="toc"></nav>
  <main>
    <p class="intro">
      Zastavený náhled na každé kartě. Najedď — uvidíš pohyb. Odjeď — zase klid.
      <small>Zaškrtni „Chci“ u toho, co má jít do decku.</small>
    </p>
    <div id="sections"></div>
    <div class="picked-box">
      <h3>Tvůj výběr — vlož mi to zpátky do chatu</h3>
      <pre id="list">Nic zaškrtnuté.</pre>
    </div>
  </main>
  <script>
    const EASE = "cubic-bezier(0.4, 0, 0.15, 1)";
    const MOVE = "cubic-bezier(0.45, 0.02, 0.15, 1)";
    const S = 2.2;
    const KEY = "vizionar-motion-picks-v2";
    const HELLO = "Hello! How can I help you today?";
    const STROJ = "Záměr.";
    const timers = new WeakMap();
    const loops = new WeakMap();
    const LOOP_MS = {
      hold: 0, loop: 0, spin: 0, auto: 0,
      ken: 8600, type: 2500, stroj: 1700, hellonow: 4500, caretthen: 3200,
      stagger: 2300, words: 2100, wordsdim: 2300, chars: 1900, slozeni: 2100,
      count: 1500, digits: 1700, plavani: 1700,
      cut: 1700, crossfade: 1600, dip: 1600, push: 1600, cover: 1500,
      blurx: 1600, linethen: 1600, list: 1600, vymena: 1400,
      fadescale: 1800, reveal: 1700, parallax: 1800, split: 1700, radial: 1800,
      chromehold: 1600, zoomthrough: 2200, swapslide: 1800, dropslide: 1700,
      doorway: 1800, fallslide: 1700,
      magicmove: 2800, dissolve: 2400, fadethrough: 2600, movein: 2000,
      scalezoom: 2600, objectpush: 2200, objectzoom: 2400, blurfocus: 2200,
    };

    const GROUPS = [
      ["apple", "Prezentační přechody"],
      ["efekty", "Klasické efekty"],
      ["text", "Text — vstup"],
      ["split", "Text — split a psaní"],
      ["obraz", "Obraz"],
      ["masky", "Masky a stěrky"],
      ["data", "Čísla, čáry, osa"],
      ["hello", "Kurzor"],
      ["prechod", "Přechod slajdů — celý slide"],
      ["kamera", "Kamera"],
      ["layout", "Layout a vztahy"],
      ["duraz", "Jednorázový důraz"],
      ["ne", "Opatrně / nedělat"],
    ];

    const ITEMS = [
      { g:"apple", id:"magicmove", name:"Magic Move", tag:"★★★★★ Apple", k:"add", blurb:"Stejný objekt přejede mezi slidy, změní místo, velikost i layout. Zoom produktu.", html:`<div class="line" data-a style="top:18px;font-size:14px">Slide A</div><div class="line" data-b style="top:18px;font-size:14px;opacity:0">Slide B</div><div class="photo" data-el style="right:auto;left:22px;top:64px;width:52px;height:52px;border-radius:10px"></div>`, kind:"magicmove" },
      { g:"apple", id:"dissolve", name:"Dissolve", tag:"★★★★★ Film", k:"add", blurb:"Jemný dlouhý kříž. Mezi scénami a kapitolami.", html:`<div class="scene-a" data-el>Kapitola 1</div><div class="scene-b" data-el2>Kapitola 2</div>`, kind:"dissolve" },
      { g:"apple", id:"fadethrough", name:"Fade Through Color", tag:"★★★★", k:"add", blurb:"Dramatičtější řez sekcí. Tady přes černou.", html:`<div class="scene-a" data-el>Akt 0</div><div class="scene-b" data-el2>KDO?</div><div data-flash style="position:absolute;inset:0;background:#000;opacity:0;pointer-events:none"></div>`, kind:"fadethrough" },
      { g:"apple", id:"movein", name:"Move In", tag:"★★★★", k:"add", blurb:"Nový slajd přijede přes starý. Kamera se hýbe, starý zůstává.", html:`<div class="scene-a">1945</div><div class="scene-b" data-el2>1964</div>`, kind:"movein" },
      { g:"apple", id:"push-cam", name:"Push", tag:"★★★★", k:"add", blurb:"Oba slajdy jedou spolu. Pocit jízdy kamery.", html:`<div class="scene-a" data-el>1</div><div class="scene-b" data-el2>2</div>`, kind:"push" },
      { g:"apple", id:"scalezoom", name:"Scale / Zoom", tag:"★★★★", k:"add", blurb:"Celek → detail, nebo naopak. Kamera, ne objekt.", html:`<div data-el style="position:absolute;inset:0;transform-origin:72% 48%"><div class="photo soft" style="left:16px;top:20px;width:70px;height:70px;right:auto"></div><div class="photo" style="left:150px;top:18px;width:120px;height:122px;right:auto"></div></div><div class="line" data-a style="top:8px;font-size:12px;left:16px">Celek</div><div class="line" data-b style="top:8px;font-size:12px;left:16px;opacity:0">Detail</div>`, kind:"scalezoom" },
      { g:"apple", id:"objectpush", name:"Object Push", tag:"★★★★ produkt", k:"add", blurb:"Pohybuje se produkt, ne celý slajd. Titulek zůstane.", html:`<div class="line" style="top:28px;max-width:11ch;font-size:18px">Nový produkt</div><div class="photo obj" data-el></div>`, kind:"objectpush" },
      { g:"apple", id:"objectzoom", name:"Object Zoom", tag:"★★★★ produkt", k:"add", blurb:"Produkt se zvětší na místě. Keynote produktové demo.", html:`<div class="line" style="top:24px;font-size:16px">Detail produktu</div><div class="photo" data-el style="right:18px;top:28px;transform-origin:80% 50%"></div>`, kind:"objectzoom" },
      { g:"apple", id:"blurfocus", name:"Blur / Focus", tag:"★★★★ cinematic", k:"add", blurb:"Rozostření → ostře. Jen když je to hodně subtilní.", html:`<div class="scene-a" data-el style="filter:blur(0)">Scéna</div><div class="scene-b" data-el2>Reveal</div>`, kind:"blurfocus" },

      { g:"efekty", id:"stroj", name:"Psací stroj", tag:"umím přidat", k:"add", blurb:"Píše po znacích s kurzorem. Hello, terminál, záměr.", html:`<div class="line" style="top:62px;font-size:22px;font-weight:650"><span data-type></span><span class="caret"></span></div>`, kind:"stroj" },
      { g:"efekty", id:"vzestup", name:"Vzestup", tag:"umím přidat", k:"add", blurb:"Přijede zdola a usadí se. Klasický vstup headline.", html:`<div class="line" data-el>Vzestup</div>`, kind:"rise", opts:{ y:42, dur:640 } },
      { g:"efekty", id:"sestup", name:"Sestup", tag:"umím přidat", k:"add", blurb:"Spadne shora. Těžší, víc „razítko“.", html:`<div class="line" data-el>Sestup</div>`, kind:"rise", opts:{ y:-42, dur:640 } },
      { g:"efekty", id:"slouceni", name:"Sloučení", tag:"umím přidat", k:"add", blurb:"Dvě části se sjedou do jedné. UX × AX, dvě éry.", html:`<div class="merge"><b data-el>UX</b><b data-mid style="opacity:0;margin:0 8px">×</b><b data-el2>AX</b></div>`, kind:"slouceni" },
      { g:"efekty", id:"rozdeleni", name:"Rozdělení", tag:"umím přidat", k:"add", blurb:"Jedno se roztrhne ve dvě. Opak sloučení.", html:`<div class="merge"><b data-el>ONE</b><b data-el2 style="position:absolute">ONE</b></div>`, kind:"rozdeleni" },

      { g:"efekty", id:"otoceni", name:"Otočení", tag:"umím přidat", k:"add", blurb:"Mírná rotace do roviny. Objekt se srovná.", html:`<div class="photo obj" data-el style="right:auto;left:70px;top:34px"></div>`, kind:"otoceni" },
      { g:"efekty", id:"priblizeni", name:"Přiblížení", tag:"umím přidat", k:"add", blurb:"Scale z 0,7. Důraz, ne kamera scény.", html:`<div class="year" data-el style="top:48px;font-size:52px">72</div>`, kind:"priblizeni" },
      { g:"efekty", id:"oddaleni", name:"Oddálení", tag:"umím přidat", k:"add", blurb:"Z detailu do sazby. Číslo si sedne.", html:`<div class="year" data-el style="top:48px;font-size:52px">72</div>`, kind:"oddaleni" },
      { g:"efekty", id:"vysunuti-l", name:"Vysunutí zleva", tag:"umím přidat", k:"add", blurb:"Přijede zleva. Nový argument.", html:`<div class="line" data-el>Vysunutí</div>`, kind:"slide", opts:{ x:-80 } },

      { g:"efekty", id:"odlet", name:"Odlet", tag:"umím přidat", k:"add", blurb:"Prvek odjede pryč. Uvolní místo.", html:`<div class="line" data-el>Odlet</div>`, kind:"odlet" },
      { g:"efekty", id:"plavani", name:"Plavání", tag:"umím přidat", k:"add", blurb:"Pomalý vzestup s měkkým dojezdem.", html:`<div class="line" data-el>Plavání</div>`, kind:"plavani" },

    function qs(root, sel) { return root.querySelector(sel); }

      Object.assign(node.style, from);

      color(stage) { qsa(stage, "[data-el]").forEach((n) => anim(n, { color: "#9aabb0" }, { color: "#03383d" }, 600)); },

      italic(stage) { qs(stage, "[data-el]").animate([{ fontStyle: "normal", opacity: 0.5 }, { fontStyle: "italic", opacity: 1 }], { duration: 480 * S, fill: "forwards", easing: EASE }); },
      stagger(stage) { qsa(stage, "[data-el]").forEach((n, i) => anim(n, { opacity: 0, transform: "translateY(12px)" }, { opacity: 1, transform: "translateY(0)" }, 480, i * 280)); },
      staggerfade(stage) { qsa(stage, "[data-el]").forEach((n, i) => anim(n, { opacity: 0, transform: "scale(0.4)" }, { opacity: 1, transform: "scale(1)" }, 360, i * 180)); },

      },
      iris(stage) { anim(qs(stage, "[data-el]"), { clipPath: "circle(0% at 50% 50%)" }, { clipPath: "circle(80% at 50% 50%)" }, 800, 0, MOVE); },
      diag(stage) { anim(qs(stage, "[data-el]"), { clipPath: "polygon(0 0, 0 0, 0 100%, 0 100%)" }, { clipPath: "polygon(0 0, 100% 0, 100% 100%, 0 100%)" }, 720, 0, MOVE); },
      settle(stage) { anim(qs(stage, "[data-el]"), { transform: "scale(1.08)", opacity: 0.7 }, { transform: "scale(1)", opacity: 1 }, 720); },
      focus(stage) {
        anim(qs(stage, "[data-el]"), { filter: "blur(10px)", opacity: 0.4 }, { filter: "blur(0px)", opacity: 1 }, 700);
        anim(qs(stage, "[data-el2]"), { filter: "blur(0px)" }, { filter: "blur(10px)" }, 700);
      },
      splitimg(stage) {
        anim(qs(stage, "[data-el]"), { transform: "translateX(-24px)", opacity: 0 }, { transform: "translateX(0)", opacity: 1 }, 640, 0, MOVE);
        anim(qs(stage, "[data-el2]"), { transform: "translateX(24px)", opacity: 0 }, { transform: "translateX(0)", opacity: 1 }, 640, 0, MOVE);
      },
      ken(stage) { anim(qs(stage, "[data-el]"), { transform: "scale(1)" }, { transform: "scale(1.12) translate(-2%, -2%)" }, 8000, 0, "linear"); },
      center(stage) { anim(qs(stage, "[data-el]"), { clipPath: "inset(50% 50% 50% 50%)" }, { clipPath: "inset(0 0 0 0)" }, 640, 0, MOVE); },
      corners(stage) { anim(qs(stage, "[data-el]"), { clipPath: "polygon(0 0, 0 0, 0 0, 0 0, 100% 0, 100% 0, 100% 0, 100% 100%, 100% 100%, 0 100%)" }, { clipPath: "polygon(0 0, 100% 0, 100% 100%, 0 100%)" }, 20); anim(qs(stage, "[data-el]"), { clipPath: "inset(50% 50% 50% 50%)" }, { clipPath: "inset(0 0 0 0)" }, 700); },
      clock(stage) { anim(qs(stage, "[data-el]"), { clipPath: "circle(0% at 50% 50%)" }, { clipPath: "circle(70% at 50% 50%)" }, 900); },
      line(stage) {
        const a = qs(stage, "[data-el]"); const b = qs(stage, "[data-el2]");
        if (a) anim(a, { opacity: 0, transform: "translateY(12px)" }, { opacity: 1, transform: "translateY(0)" }, 480);
        if (b) anim(b, { transform: "scaleX(0)" }, { transform: "scaleX(1)" }, 620, 160);
      },
      maskline(stage) {
        const t = qs(stage, "[data-el]"); const l = qs(stage, "[data-el2]");
        t.style.clipPath = "inset(0 100% 0 0)";
        anim(l, { transform: "translateX(0)" }, { transform: "translateX(230px)" }, 800, 0, MOVE);
        later(stage, 40, () => anim(t, { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0 0 0)" }, 800, 0, MOVE));
      },
      rail(stage) {
        anim(qs(stage, "[data-el]"), { transform: "scaleX(0)" }, { transform: "scaleX(0.5)" }, 850, 0, MOVE);
        anim(qs(stage, "[data-el2]"), { transform: "translateX(0px)" }, { transform: "translateX(80px)" }, 850, 0, MOVE);
      },
      count(stage, { to = 72 } = {}) {
        const n = qs(stage, "[data-el]");
        if (INSTANT) { n.textContent = String(to); return; }
        const start = performance.now();
        const tick = (now) => {
          const t = Math.min(1, (now - start) / (560 * S));
          n.textContent = String(Math.round((1 - Math.pow(1 - t, 3)) * to));
          if (t < 1) requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      },
      digits(stage) {
        const n = qs(stage, "[data-el]");
        const end = "1964";
        if (INSTANT) { n.textContent = end; return; }
        let i = 0;
        const tick = () => {
          n.textContent = end.split("").map((d, idx) => (idx <= i ? d : String(Math.floor(Math.random() * 10)))).join("");
          if (i < 3) { i += 1; later(stage, 140, tick); } else n.textContent = end;
        };
        tick();
      },
      bar(stage) { anim(qs(stage, "[data-el]"), { width: "0%" }, { width: "91%" }, 700, 0, MOVE); },
      svg(stage) {
        const p = qs(stage, "[data-el]");
        const len = p.getTotalLength ? p.getTotalLength() : 220;
        p.style.strokeDasharray = String(len);
        anim(p, { strokeDashoffset: len }, { strokeDashoffset: 0 }, 900);
      },
      cut(stage) {
        const a = qs(stage, "[data-el]"); const b = qs(stage, "[data-el2]");
        a.style.opacity = "1"; b.style.opacity = "0";
        later(stage, 600, () => { a.style.opacity = "0"; b.style.opacity = "1"; });
      },
      crossfade(stage) {
        const a = qs(stage, "[data-el]"); const b = qs(stage, "[data-el2]");
        a.style.opacity = "1"; b.style.opacity = "0";
        later(stage, 450, () => { anim(a, { opacity: 1 }, { opacity: 0 }, 240); anim(b, { opacity: 0 }, { opacity: 1 }, 240); });
      },
      dip(stage) {
        const a = qs(stage, "[data-el]"); const b = qs(stage, "[data-el2]"); const f = qs(stage, "[data-flash]");
        a.style.opacity = "1"; b.style.opacity = "0";
        later(stage, 350, () => {
          anim(f, { opacity: 0 }, { opacity: 1 }, 180);
          later(stage, 180, () => { a.style.opacity = "0"; b.style.opacity = "1"; anim(f, { opacity: 1 }, { opacity: 0 }, 220); });
        });
      },
      push(stage, { dir = "left" } = {}) {
        const a = qs(stage, "[data-el]"); const b = qs(stage, "[data-el2]");
        const aTo = { left: "translateX(-100%)", right: "translateX(100%)", up: "translateY(-100%)", down: "translateY(100%)" }[dir];
        const bFrom = { left: "translateX(100%)", right: "translateX(-100%)", up: "translateY(100%)", down: "translateY(-100%)" }[dir];
        b.style.transform = bFrom;
        later(stage, 300, () => {
          anim(a, { transform: "translate(0)" }, { transform: aTo }, 560, 0, MOVE);
          anim(b, { transform: bFrom }, { transform: "translate(0)" }, 560, 0, MOVE);
        });
      },
      cover(stage, { from = "right" } = {}) {
        const start = { right: "translateX(100%)", left: "translateX(-100%)", top: "translateY(-100%)", bottom: "translateY(100%)" }[from];
        anim(qs(stage, "[data-el]"), { transform: start }, { transform: "translate(0)" }, 560, 280, MOVE);
      },
      reveal(stage, { axis = "x", sign = -1 } = {}) {
        const a = qs(stage, "[data-el]"); const b = qs(stage, "[data-el2]");
        if (b) b.style.opacity = "1";
        a.style.zIndex = "2";
        const to = axis === "y" ? `translateY(${100 * sign}%)` : `translateX(${100 * sign}%)`;
        later(stage, 280, () => anim(a, { transform: "translate(0)" }, { transform: to }, 560, 0, MOVE));
      },
      fadescale(stage) {
        const a = qs(stage, "[data-el]"); const b = qs(stage, "[data-el2]");
        b.style.opacity = "0";
        later(stage, 200, () => {
          anim(a, { opacity: 1, transform: "scale(1)" }, { opacity: 0, transform: "scale(1.08)" }, 480);
          anim(b, { opacity: 0, transform: "scale(0.92)" }, { opacity: 1, transform: "scale(1)" }, 480);
        });
      },
      parallax(stage) {
        const a = qs(stage, "[data-el]"); const b = qs(stage, "[data-el2]");
        b.style.transform = "translateX(100%)";
        later(stage, 280, () => {
          anim(a, { transform: "translateX(0)" }, { transform: "translateX(-42%)" }, 680, 0, MOVE);
          anim(b, { transform: "translateX(100%)" }, { transform: "translateX(0)" }, 680, 0, MOVE);
        });
      },
      split(stage) {
        later(stage, 280, () => {
          anim(qs(stage, "[data-el]"), { transform: "translateX(0)" }, { transform: "translateX(-100%)" }, 560, 0, MOVE);
          anim(qs(stage, "[data-el2]"), { transform: "translateX(0)" }, { transform: "translateX(100%)" }, 560, 0, MOVE);
        });
      },
      radial(stage) {
        anim(qs(stage, "[data-el]"), { clipPath: "circle(0% at 78% 42%)" }, { clipPath: "circle(140% at 78% 42%)" }, 760, 200, MOVE);
      },
      chromehold(stage) {
        const a = qs(stage, "[data-el]"); const b = qs(stage, "[data-el2]");
        b.style.opacity = "0";
        later(stage, 300, () => {
          anim(a, { opacity: 1 }, { opacity: 0 }, 280);
          anim(b, { opacity: 0 }, { opacity: 1 }, 280);
        });
      },
      zoomthrough(stage) {
        const a = qs(stage, "[data-el]"); const b = qs(stage, "[data-el2]"); const f = qs(stage, "[data-flash]");
        b.style.opacity = "0";
        later(stage, 180, () => {
          anim(a, { transform: "scale(1)", opacity: 1 }, { transform: "scale(1.45)", opacity: 0 }, 420);
          anim(f, { opacity: 0 }, { opacity: 1 }, 280, 140);
          later(stage, 480, () => {
            a.style.opacity = "0";
            anim(b, { opacity: 0, transform: "scale(1.12)" }, { opacity: 1, transform: "scale(1)" }, 420, 0, MOVE);
            anim(f, { opacity: 1 }, { opacity: 0 }, 280);
          });
        });
      },
      swapslide(stage) {
        const a = qs(stage, "[data-el]"); const b = qs(stage, "[data-el2]");
        a.style.zIndex = "2";
        b.style.zIndex = "1";
        b.style.transform = "translateX(38%) scale(0.82)";
        later(stage, 240, () => {
          anim(a, { transform: "translateX(0) scale(1)" }, { transform: "translateX(-38%) scale(0.82)" }, 640, 0, MOVE);
          anim(b, { transform: "translateX(38%) scale(0.82)" }, { transform: "translateX(0) scale(1)" }, 640, 0, MOVE);
        });
      },
      dropslide(stage) {
        anim(qs(stage, "[data-el]"), { transform: "translateY(-100%)" }, { transform: "translateY(0)" }, 640, 280, MOVE);
      },
      doorway(stage) {
        later(stage, 280, () => {
          anim(qs(stage, "[data-el]"), { transform: "rotateY(0deg)" }, { transform: "rotateY(-95deg)" }, 700, 0, MOVE);
          anim(qs(stage, "[data-el2]"), { transform: "rotateY(0deg)" }, { transform: "rotateY(95deg)" }, 700, 0, MOVE);
        });
      },
      fallslide(stage) {
        later(stage, 280, () => {
          anim(qs(stage, "[data-el]"), { transform: "translateY(0) rotate(0deg)", opacity: 1 }, { transform: "translateY(110%) rotate(7deg)", opacity: 0 }, 620, 0, MOVE);
        });
      },
      blurx(stage) {
        const a = qs(stage, "[data-el]"); const b = qs(stage, "[data-el2]");
        b.style.opacity = "0";
        later(stage, 300, () => {
          anim(a, { filter: "blur(0px)", opacity: 1 }, { filter: "blur(12px)", opacity: 0 }, 400);
          anim(b, { filter: "blur(12px)", opacity: 0 }, { filter: "blur(0px)", opacity: 1 }, 400, 80);
        });
      },
      flip(stage) {
        const n = qs(stage, "[data-el]");
        anim(n, { left: "28px", width: "56px", height: "56px" }, { left: "190px", width: "96px", height: "110px" }, 720, 0, MOVE);
      },
      linethen(stage) {
        const a = qs(stage, "[data-el]"); const b = qs(stage, "[data-el2]"); const l = qs(stage, "[data-el3]");
        b.style.opacity = "0";
        anim(l, { transform: "translateX(-8px)" }, { transform: "translateX(320px)" }, 520, 200, MOVE);
        later(stage, 520, () => { a.style.opacity = "0"; b.style.opacity = "1"; });
      },
      zoom(stage) { anim(qs(stage, "[data-el]"), { transform: "scale(1)" }, { transform: "scale(1.5)" }, 720, 0, MOVE); },
      zoomout(stage) { anim(qs(stage, "[data-el]"), { transform: "scale(1.5)" }, { transform: "scale(1)" }, 720, 0, MOVE); },
      pan(stage) { anim(qs(stage, "[data-el]"), { transform: "translateX(0)" }, { transform: "translateX(-28%)" }, 900, 0, MOVE); },
      via(stage) {
        qs(stage, "[data-el]").animate(
          [{ transform: "translateX(0)" }, { transform: "translateX(-36px)", offset: 0.38 }, { transform: "translateX(-110px)" }],
          { duration: 900 * S, easing: MOVE, fill: "forwards" },
        );
      },
      fan(stage) {
        const [a, b, c] = qsa(stage, "[data-el]");
        anim(a, { transform: "rotate(0deg) translate(0,0)", left: "128px" }, { transform: "rotate(-14deg)", left: "86px" }, 600, 0, MOVE);
        anim(b, { transform: "rotate(0)" }, { transform: "rotate(0)" }, 600);
        anim(c, { transform: "rotate(0deg)", left: "128px" }, { transform: "rotate(14deg)", left: "170px" }, 600, 0, MOVE);
      },
      cascade(stage) { qsa(stage, "[data-el]").forEach((n, i) => anim(n, { opacity: 0, transform: "translateY(18px)" }, { opacity: 1, transform: "translateY(0)" }, 480, i * 140)); },
      stackrow(stage) {
        const ns = qsa(stage, "[data-el]");
        ns.forEach((n, i) => anim(n, { left: `${28 + i * 8}px`, top: `${34 + i * 8}px` }, { left: `${28 + i * 84}px`, top: "34px" }, 700, 80, MOVE));
      },
      pathmove(stage) { anim(qs(stage, "[data-el]"), { left: "24px", top: "60px" }, { left: "210px", top: "28px" }, 800, 0, MOVE); },
      morph(stage) { anim(qs(stage, "[data-el]"), { borderRadius: "50%", width: "72px", height: "72px" }, { borderRadius: "12px", width: "120px", height: "96px", left: "80px" }, 700, 0, MOVE); },
      tilt(stage) { anim(qs(stage, "[data-el]"), { transform: "perspective(600px) rotateY(18deg)", opacity: 0.6 }, { transform: "perspective(600px) rotateY(0deg)", opacity: 1 }, 640); },
      pulse(stage) {
        qs(stage, "[data-el]").animate(
          [{ transform: "scale(1)" }, { transform: "scale(1.06)", offset: 0.45 }, { transform: "scale(1)" }],
          { duration: 520 * S, easing: EASE, fill: "forwards" },
        );
      },
      glow(stage) {
        const n = qs(stage, "[data-el]");
        n.animate(
          [{ boxShadow: "0 0 0 0 rgba(195,213,82,0)" }, { boxShadow: "0 0 0 14px rgba(195,213,82,.45)", offset: 0.4 }, { boxShadow: "0 0 0 0 rgba(195,213,82,0)" }],
          { duration: 700 * S, fill: "forwards", easing: EASE },
        );
      },
      dimrest(stage) { anim(qs(stage, "[data-el2]"), { opacity: 1 }, { opacity: 0.22 }, 400, 400); anim(qs(stage, "[data-el]"), { opacity: 0 }, { opacity: 1 }, 400); },
      shake(stage) {
        qs(stage, "[data-el]").animate(
          [{ transform: "translateX(0)" }, { transform: "translateX(-3px)" }, { transform: "translateX(3px)" }, { transform: "translateX(0)" }],
          { duration: 280 * S, easing: EASE },
        );
      },
      bounce(stage) {
        qs(stage, "[data-el]").animate(
          [{ transform: "translateY(-36px)", opacity: 0 }, { transform: "translateY(8px)", opacity: 1, offset: 0.6 }, { transform: "translateY(0)" }],
          { duration: 800 * S, fill: "forwards", easing: EASE },
        );
      },
      loop(stage) { qs(stage, "[data-el]").animate([{ transform: "scaleX(0)" }, { transform: "scaleX(1)" }], { duration: 1600, iterations: Infinity, direction: "alternate", easing: EASE }); },
      spin(stage) { qs(stage, "[data-el]").animate([{ transform: "rotate(0deg)" }, { transform: "rotate(360deg)" }], { duration: 2400, iterations: Infinity, easing: "linear" }); },
    };

    const picks = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
    let filter = "all";

    const sections = document.getElementById("sections");
    const toc = document.getElementById("toc");
    GROUPS.forEach(([id, label]) => {
      toc.append(Object.assign(document.createElement("a"), { href: "#" + id, textContent: label.split(" — ")[0] }));
      const h = document.createElement("h2"); h.id = id; h.textContent = label;
      const grid = document.createElement("div"); grid.className = "grid"; grid.dataset.g = id;
      sections.append(h, grid);
    });

    const filters = document.getElementById("filters");
    [["all","Vše"],["v","Už v decku"],["add","Umím přidat"],["warn","Opatrně"],["no","Nedělat"]].forEach(([id, label]) => {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = label; b.dataset.f = id;
      if (id === "all") b.classList.add("on");
      b.onclick = () => {
        filter = id;
        [...filters.children].forEach((x) => x.classList.toggle("on", x.dataset.f === id));
        applyFilter();
      };
      filters.append(b);
    });

    function renderList() {
      const chosen = ITEMS.filter((i) => picks.has(i.id) && !i.no);
      document.getElementById("count").textContent = `Vybráno ${chosen.length}`;
      document.getElementById("list").textContent = chosen.length
        ? chosen.map((i) => `• ${i.name}`).join("\n")
        : "Nic zaškrtnuté.";
    }
    function applyFilter() {
      document.querySelectorAll(".card").forEach((c) => {
        const item = ITEMS.find((i) => i.id === c.dataset.id);
        c.classList.toggle("hide", filter !== "all" && item.k !== filter);
      });
    }
    function playItem(item, stage) {
      clearLater(stage);
      INSTANT = false;
      stage.innerHTML = item.html;
      KINDS[item.kind]?.(stage, item.opts || {});
    }
    function still(item, stage) {
      clearLater(stage);
      stage.innerHTML = item.html;
      if (["loop", "spin", "odlet", "sbaleni"].includes(item.kind)) return;
      INSTANT = true;
      try { KINDS[item.kind]?.(stage, item.opts || {}); }
      finally { INSTANT = false; }
      stage.getAnimations({ subtree: true }).forEach((a) => { try { a.finish(); } catch (e) {} });
      const typed = stage.querySelector("[data-type]");
      if (typed) typed.textContent = item.kind === "stroj" ? STROJ : HELLO;
      const caret = stage.querySelector("[data-caret]");
      if (caret) caret.style.opacity = "1";
    }

    ITEMS.forEach((item) => {
      const art = document.createElement("article");
      art.className = `card${item.no ? " is-no" : ""}${picks.has(item.id) ? " is-picked" : ""}`;
      art.dataset.id = item.id;
      art.innerHTML = `
        <div class="stage${["cut","crossfade","push","cover","wipe-r","wipe-u","wipe-slide","wipe-up","dipwhite","dipteal","diplime","dippaper","blurx","linethen","list","dissolve","fadethrough","movein","push-cam","blurfocus","fade-scale","push-up","push-down","parallax","cover-left","cover-up","reveal-slide","uncover","uncover-up","split-slide","iris-slide","radial-wipe","chrome","zoom-through","swap-slide","drop-slide","flip-slide","doorway","fall-slide","mosaic"].includes(item.id) ? " ink" : ""}"></div>
        <div class="meta">
          <h3>${item.name}</h3>
          <span class="tag ${item.k === "add" ? "add" : item.k === "warn" ? "warn" : item.k === "no" ? "no" : ""}">${item.tag}</span>
          <p>${item.blurb}</p>
          <div class="row">
            ${item.no ? "" : `<label><input type="checkbox" ${picks.has(item.id) ? "checked" : ""}/> Chci</label>`}
          </div>
        </div>`;
      const stage = art.querySelector(".stage");
      still(item, stage);
      art.addEventListener("mouseenter", () => playItem(item, stage));
      art.addEventListener("mouseleave", () => still(item, stage));
      const box = art.querySelector("input");
      if (box) box.addEventListener("change", () => {
        if (box.checked) picks.add(item.id); else picks.delete(item.id);
        art.classList.toggle("is-picked", box.checked);
        localStorage.setItem(KEY, JSON.stringify([...picks]));
        renderList();
      });
      document.querySelector(`[data-g="${item.g}"]`).append(art);
    });

    document.getElementById("clear").onclick = () => {
      picks.clear(); localStorage.removeItem(KEY);
      document.querySelectorAll(".card").forEach((c) => c.classList.remove("is-picked"));
      document.querySelectorAll("input[type=checkbox]").forEach((c) => { c.checked = false; });
      renderList();
    };
    document.getElementById("copy").onclick = async () => {
      await navigator.clipboard.writeText(document.getElementById("list").textContent);
      document.getElementById("copy").textContent = "Zkopírováno";
      setTimeout(() => { document.getElementById("copy").textContent = "Zkopírovat výběr"; }, 1400);
    };
    renderList();
  </script>
</body>
</html>
